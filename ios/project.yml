# Проект Xcode генерируется из этого файла (XcodeGen) — сам
# `.xcodeproj` в git не лежит: его формат руками не пишется и в
# слиянии конфликтует на каждой строке. Сборка — `.github/workflows/
# ios-testflight.yml`; на маке: `brew install xcodegen && xcodegen`.
name: Algoth
options:
  bundleIdPrefix: pl.mdsauto
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
targets:
  Algoth:
    type: application
    platform: iOS
    sources:
      - path: Algoth
    settings:
      base:
        PRODUCT_NAME: Algoth
        PRODUCT_BUNDLE_IDENTIFIER: pl.mdsauto.algoth
        INFOPLIST_FILE: Algoth/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: NO
