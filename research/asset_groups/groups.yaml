# Экономическая группировка активов
#
# Назначение: сократить пространство поиска пар ДО статистики.
# Спецификация 02, раздел 3.1. Пара, у которой нет причины быть парой,
# — это шум, прошедший тест.
#
# Группы отражают то, что РЕАЛЬНО СО-ДВИЖЕТСЯ, а не техническую точность
# классификации. «ИИ-агенты» ходят вместе из-за нарратива, а не из-за
# общей технологии.
#
# ОХВАТ. Размечается всё, что может попасть хотя бы в одно окно
# walk-forward: криптоактив с историей Binance, листингованный не позже
# чем за 365 дней до конца данных. Это 490 активов, а не 269 когорт
# «3+ года» — те покрывали только ранние окна.
#
# ЧЕГО ЗДЕСЬ НЕТ. Деления по обороту. Крупные группы дробятся слоем
# tiers на момент окна (`tiers.py`), потому что деление «майоры против
# остальных» по сегодняшнему обороту есть заглядывание вперёд: сегодня
# майор, а в окне 2022 года — нет.
#
# Проверяется `check_coverage.py` после каждой правки.

