# Экономическая группировка активов
#
# Назначение: сократить пространство поиска пар ДО статистики.
# Спецификация 02, раздел 3.1.
#
# Без группировки кандидатов ~15 000 пар, из которых около 750 пройдут
# тест на коинтеграцию чистой случайностью. Группировка убирает основную
# массу бессмысленных сочетаний до того, как начнётся перебор.
#
# ВАЖНО: группы отражают то, что РЕАЛЬНО СО-ДВИЖЕТСЯ, а не техническую
# точность классификации. "AI-токены" ходят вместе из-за нарратива,
# а не из-за общей технологии. Если два актива реагируют на одни и те же
# новости и одни и те же потоки — они в одной группе, даже если
# технически не связаны.
#
# СТАТУС: черновик, составлен ассистентом по 269 активам когорт
# с историей 3+ года. Требует правки владельцем проекта — здесь нужна
# экспертиза трейдера, наблюдавшего эти активы, а не формальная таксономия.
#
# Что проверить в первую очередь:
#   1. Активы в разделе `unclassified` — куда их
#   2. Группа `smart_contract_l1` слишком велика (35 активов = 595 пар).
#      Стоит ли дробить по капитализации или по возрасту
#   3. Активы, попавшие не туда по вашему опыту
#   4. Пары, которые вы знаете как рабочие, но которые группировка разводит

groups:

  # --- Bitcoin и PoW ---------------------------------------------------
  # Старые монеты, реагируют на одни и те же нарративы (халвинг, майнинг,
  # регуляторка по PoW). Исторически самая устойчивая группа.
  bitcoin_pow:
    - BTC
    - BCH
    - BSV
    - LTC
    - DASH
    - DGB
    - RVN
    - ETC
    - ETHW
    - ZEC
    - ZEN
    - XMR

  # --- Смарт-контрактные L1 --------------------------------------------
