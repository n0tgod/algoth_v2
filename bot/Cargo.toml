[package]
name = "bot"
version = "0.1.0"
edition = "2021"

# Каждая зависимость — решение, а не привычка (спека 09 §8).
# serde/serde_json — формат журнала; flate2 — сжатие закрытых суток.
# tokio и tungstenite появятся в E2 вместе с вебсокетом, не раньше.
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
flate2 = "1"
# X1 (спека 12): живое исполнение. ureq — блокирующий HTTP с rustls
# (без tokio: такт адаптера секундный, асинхронность не нужна);
# hmac/sha2/hex — подпись Bybit V5. Появились вместе с адаптером,
# не раньше.
ureq = { version = "2", features = ["json"] }
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
